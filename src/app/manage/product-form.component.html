<div class="page-head">
  <h1>{{ isEdit ? 'Edit product' : 'Add product' }}</h1>
  <a routerLink="/admin/products" class="btn btn-ghost">Back to products</a>
</div>

<div *ngIf="loading" class="spinner-row">Loading…</div>
<div *ngIf="error" class="alert alert-error">{{ error }}</div>

<form *ngIf="!loading" class="card card-pad form" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="field">
    <label for="pf-name">Name</label>
    <input id="pf-name" class="input" formControlName="name" [class.invalid]="bad('name')">
    <span class="error-text" *ngIf="bad('name')">Enter a product name.</span>
  </div>
  <div class="field">
    <label for="pf-desc">Description</label>
    <textarea id="pf-desc" class="input" formControlName="description"></textarea>
  </div>
  <div class="form-row">
    <div class="field">
      <label for="pf-price">Price (Rs)</label>
      <input id="pf-price" type="number" step="0.01" min="0" class="input" formControlName="price" [class.invalid]="bad('price')">
      <span class="error-text" *ngIf="bad('price')">Price must be greater than 0.</span>
    </div>
    <div class="field">
      <label for="pf-cat">Category (optional)</label>
      <select id="pf-cat" class="input" formControlName="categoryId">
        <option [ngValue]="null">No category</option>
        <option *ngFor="let c of categories" [ngValue]="c.id" [disabled]="c.isActive === false">{{ c.name }}{{ c.isActive === false ? ' (archived)' : '' }}</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="field">
      <label for="pf-stock">{{ isEdit ? 'Current stock' : 'Opening stock' }}</label>
      <input id="pf-stock" type="number" min="0" class="input" formControlName="initialStock" [class.invalid]="bad('initialStock')">
      <span class="hint" *ngIf="isEdit">Change stock from the Inventory page.</span>
      <span class="error-text" *ngIf="bad('initialStock')">Stock cannot be negative.</span>
    </div>
    <div class="field">
      <label for="pf-img">Image address (optional)</label>
      <input id="pf-img" class="input" formControlName="imageUrl" placeholder="https://…">
    </div>
  </div>
  <label class="check"><input type="checkbox" formControlName="isActive"> Show this product in the store</label>

  <div class="form-actions">
    <button type="submit" class="btn" [disabled]="saving">{{ saving ? 'Saving…' : (isEdit ? 'Save changes' : 'Add product') }}</button>
    <a routerLink="/admin/products" class="btn btn-ghost">Cancel</a>
  </div>
</form>
